<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const KMX = 36.1, KMZ = 24.1;      // 覆盖公里数（6×4 块 z12 瓦片）
const VEX = 3.0;                    // 高程夸张倍数（回到第一稿 ×3）
const BASE = 456;                   // 湖面基准

const data = await (await fetch('baik3d-data.json')).json();
const gw = data.gridW, gh = data.gridH;

// ---------- 读高度图 ----------
async function gray(url) {
  const img = new Image(); img.src = url; await img.decode();
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
  return ctx.getImageData(0, 0, img.width, img.height).data;
}
const hdata = await gray('terrain-height.png');
const ldata = await gray('terrain-lake.png');
const [EMIN, EMAX] = data.elevMap;

function elevAt(px, py) {
  const x = Math.max(0, Math.min(gw-1, px|0)), y = Math.max(0, Math.min(gh-1, py|0));
  const v = hdata[(y*gw + x)*4] / 255;
  return EMIN + v * (EMAX - EMIN);
}
function isLake(px, py) {
  const x = Math.max(0, Math.min(gw-1, px|0)), y = Math.max(0, Math.min(gh-1, py|0));
  return ldata[(y*gw + x)*4] > 128;
}

// ---------- 场景 ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090c);
scene.fog = new THREE.FogExp2(0x07090c, 0.010);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.2, 400);
camera.position.set(-24, 26, 24);
if (camera.aspect < 1) camera.position.multiplyScalar(1.7);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.target.set(0, 1.5, 0);
controls.maxPolarAngle = Math.PI/2 - 0.04;
controls.minDistance = 8; controls.maxDistance = 90;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

scene.add(new THREE.HemisphereLight(0xa9cbe8, 0x22261d, 0.85));
const sun = new THREE.DirectionalLight(0xfff3e0, 1.85);
sun.position.set(-18, 26, 12); scene.add(sun);
const fillLight = new THREE.DirectionalLight(0x8fb4d4, 0.45);
fillLight.position.set(20, 10, -16); scene.add(fillLight);

// ---------- 地形 ----------
const IS_MOBILE = Math.min(innerWidth, innerHeight) < 700;
const SEG = IS_MOBILE ? 320 : 520;   // 手机降密度保帧率
const geo = new THREE.PlaneGeometry(KMX, KMZ, SEG, SEG);
geo.rotateX(-Math.PI/2);
const pos = geo.attributes.position;
const colors = new Float32Array(pos.count * 3);
// 第一遍：位移
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const px = (x/KMX + 0.5) * gw, py = (z/KMZ + 0.5) * gh;
  const e = elevAt(px, py);
  const y = isLake(px, py) ? (BASE - 40) : e;
  pos.setY(i, (y - BASE) / 1000 * VEX);
}
geo.computeVertexNormals();

// 第二遍：按「高程 + 坡度」上色 —— 贴近实地（湖岸砾石／针叶林／崖壁裸岩）
const nrm = geo.attributes.normal;
const C_BEACH  = new THREE.Color(0x9c9689);   // 湖岸砾石滩
const C_FOREST = new THREE.Color(0x2a4230);   // 针叶林
const C_FOREST2= new THREE.Color(0x1e3324);   // 密林阴面
const C_MIX    = new THREE.Color(0x4c5546);   // 林岩过渡
const C_ROCK   = new THREE.Color(0x6e7274);   // 崖壁裸岩
const C_ROCK2  = new THREE.Color(0x9aa0a2);   // 高处浅色岩
const tmp = new THREE.Color();
function hash(i){ const v = Math.sin(i * 12.9898) * 43758.5453; return v - Math.floor(v); }
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const px = (x/KMX + 0.5) * gw, py = (z/KMZ + 0.5) * gh;
  const e = elevAt(px, py);
  const j = hash(i) * 0.45;                                  // 确定性噪声，避免色带
  if (isLake(px, py) || e < 478) tmp.copy(C_BEACH);
  else if (e < 600) tmp.copy(C_FOREST).lerp(C_FOREST2, 0.25 + j);
  else if (e < 780) tmp.copy(C_FOREST2).lerp(C_MIX, (e-600)/180 + j*0.4);
  else if (e < 900) tmp.copy(C_MIX).lerp(C_ROCK, (e-780)/120 + j*0.3);
  else tmp.copy(C_ROCK).lerp(C_ROCK2, Math.min(1, (e-900)/160 + j*0.3));
  const slope = 1 - Math.abs(nrm.getY(i));                   // 越陡越露岩
  const sBlend = Math.max(0, Math.min(1, (slope - 0.16) / 0.32));
  tmp.lerp(C_ROCK, sBlend * 0.85);
  colors[i*3] = tmp.r; colors[i*3+1] = tmp.g; colors[i*3+2] = tmp.b;
}
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.94, metalness:0.04, flatShading:false
}));
scene.add(terrain);

// ---------- 湖面 ----------
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(KMX*9, KMZ*9),   // 大幅外扩，水面边缘移出画面
  new THREE.MeshStandardMaterial({ color:0x18485f, roughness:0.34, metalness:0.42 })
);
water.rotation.x = -Math.PI/2;
water.position.y = -0.004;
scene.add(water);

// ---------- 路线 ----------
const route = data.route.map(([nx, ny, e]) => new THREE.Vector3(
  (nx - 0.5) * KMX,
  (e - BASE) / 1000 * VEX + 0.085,
  (ny - 0.5) * KMZ
));
const curve = new THREE.CatmullRomCurve3(route, false, 'catmullrom', 0.15);

// 底光晕（粗淡线）
const halo = new THREE.Mesh(
  new THREE.TubeGeometry(curve, IS_MOBILE ? 700 : 1400, 0.085, 6, false),
  new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.20 })
);
scene.add(halo);
// 主线
const lineMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.95 });
const line = new THREE.Mesh(new THREE.TubeGeometry(curve, IS_MOBILE ? 700 : 1400, 0.026, 6, false), lineMat);
scene.add(line);

// ---------- 进度光点 ----------
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 18),
  new THREE.MeshBasicMaterial({ color:0xffffff }));
scene.add(dot);
const glow = new THREE.Mesh(new THREE.SphereGeometry(0.42, 18, 18),
  new THREE.MeshBasicMaterial({ color:0x9fd0ff, transparent:true, opacity:0.22 }));
scene.add(glow);

// ---------- 标签 ----------
// ---------- 关键点标注（按累计里程定位，中文＋俄文）----------
const LABEL_SPEC = [
  { km:  0.0, t: '利斯特维扬卡（起点）',               main: true  },
  { km: 14.8, t: '黑谷营地（第 1 夜）· Падь Чёрная',   main: false },
  { km: 17.9, t: '大科特 · Большие Коты',             main: false },
  { km: 22.4, t: '斯克佩瑞尔悬崖 · Утёс Скрипер',      main: false },
  { km: 30.5, t: '卡迪利石灰岩（第 2 夜）',            main: false },
  { km: 45.8, t: '大戈洛（终点）',                     main: true  },
];

// 里程 → 路线点（x,y 归一化 + 高程）
function pointAtKm(km) {
  const cum = data.cumKm;
  let lo = 0, hi = cum.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= km) lo = mid; else hi = mid; }
  const r = data.route[lo];
  return { x: r[0], y: r[1], e: r[2] };
}
const chosen = LABEL_SPEC.map(sp => ({ ...pointAtKm(sp.km), n: sp.t, main: sp.main }));

const labelEls = chosen.map((w, idx) => {
  const d = document.createElement('div');
  d.className = 'lbl' + (w.main ? ' main' : '');
  d.textContent = w.n;
  document.body.appendChild(d);
  const p = new THREE.Vector3((w.x-0.5)*KMX, (w.e-BASE)/1000*VEX + 0.6, (w.y-0.5)*KMZ);
  return { el:d, p, off:(idx % 4) * 22 };
});

// ---------- 播放控制 ----------
let playing = true, u = 0;
const fill = document.getElementById('fill'), kmEl = document.getElementById('km'), btn = document.getElementById('play');
btn.onclick = () => { playing = !playing; btn.textContent = playing ? '暂停' : '播放'; };

let camMode = 'orbit';
controls.addEventListener('start', () => { camMode = 'free'; });

const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) {
    u += dt * 0.028;
    if (u > 1) { u = 0; }
  }
  const pt = curve.getPointAt(Math.min(u, 1));
  dot.position.copy(pt); glow.position.copy(pt);
  glow.scale.setScalar(1 + Math.sin(performance.now()/420)*0.16);

  fill.style.width = (u*100) + '%';
  kmEl.textContent = (u*data.lengthKm).toFixed(1) + ' / ' + data.lengthKm + ' km';

  // 相机跟随（未手动干预时）
  if (camMode !== 'free') {
    const ahead = curve.getPointAt(Math.min(u + 0.035, 1));
    const adj = camera.aspect < 1 ? 1.85 : 1.0;   // 窄屏（手机竖屏）自动拉远
    const want = ahead.clone().add(new THREE.Vector3(-9.5*adj, 12.0*adj, 9.5*adj));
    camera.position.lerp(want, 2.4*dt);
    controls.target.lerp(pt, 3.0*dt);
  }
  controls.update();
  renderer.render(scene, camera);

  labelEls.forEach(({el, p, off}) => {
    const v = p.clone().project(camera);
    const vis = v.z < 1 && v.x > -1.05 && v.x < 1.05 && v.y > -1.05 && v.y < 1.05;
    el.style.display = vis ? 'block' : 'none';
    // 贴边钳制，避免标签被屏幕切掉
    const halfW = el.offsetWidth / 2 + 6;
    const pxRaw = (v.x*0.5+0.5)*innerWidth;
    const pxClamped = Math.max(halfW, Math.min(innerWidth - halfW, pxRaw));
    el.style.left = pxClamped + 'px';
    // 纵向安全区：落在 HUD 区或进度条区时「暂时隐藏」，不硬挤成一条线
    const safeTop = innerWidth < 700 ? 268 : 168;
    const safeBottom = innerHeight - 96;
    const pyRaw = (-v.y*0.5+0.5)*innerHeight - (off||0);
    if (pyRaw < safeTop || pyRaw > safeBottom) { el.style.display = 'none'; return; }
    el.style.top = pyRaw + 'px';
  });
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.__b3 = { scene, camera, controls, renderer, THREE, curve, data,
                setU:(v)=>{u=v; camMode='free';}, follow:()=>{camMode='orbit';} };
</script>
