<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const KMX = 36.1, KMZ = 24.1;      // 覆盖公里数（6×4 块 z12 瓦片）
const VEX = 8.0;                    // 高程夸张倍数（36km 场景内要让 150m 崖体可见）
const BASE = 456;                   // 湖面基准

const data = await (await fetch('baik3d-data.json')).json();
const gw = data.gridW, gh = data.gridH;

// ---------- 读高度图 ----------
async function gray(url) {
  const img = new Image(); img.src = url; await img.decode();
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0);
  return ctx.getImageData(0, 0, img.width, img.height).data;
}
const hdata = await gray('terrain-height.png');
const ldata = await gray('terrain-lake.png');
const [EMIN, EMAX] = data.elevMap;

function elevAt(px, py) {
  const x = Math.max(0, Math.min(gw-1, px|0)), y = Math.max(0, Math.min(gh-1, py|0));
  const v = hdata[(y*gw + x)*4] / 255;
  return EMIN + v * (EMAX - EMIN);
}
function isLake(px, py) {
  const x = Math.max(0, Math.min(gw-1, px|0)), y = Math.max(0, Math.min(gh-1, py|0));
  return ldata[(y*gw + x)*4] > 128;
}

// ---------- 场景 ----------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07090c);
scene.fog = new THREE.FogExp2(0x07090c, 0.010);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.2, 400);
camera.position.set(-21, 17, 21);
if (camera.aspect < 1) camera.position.multiplyScalar(1.7);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.target.set(0, 1.5, 0);
controls.maxPolarAngle = Math.PI/2 - 0.04;
controls.minDistance = 8; controls.maxDistance = 90;

scene.add(new THREE.HemisphereLight(0x93a7bd, 0x05070a, 0.85));
const sun = new THREE.DirectionalLight(0xf2f6ff, 1.55);
sun.position.set(-18, 26, 12); scene.add(sun);
const fillLight = new THREE.DirectionalLight(0x7d93ad, 0.5);
fillLight.position.set(20, 10, -16); scene.add(fillLight);

// ---------- 地形 ----------
const SEG = 520;
const geo = new THREE.PlaneGeometry(KMX, KMZ, SEG, SEG);
geo.rotateX(-Math.PI/2);
const pos = geo.attributes.position;
const colors = [];
const cLow  = new THREE.Color(0x2b3a33);   // 低处（林地）
const cMid  = new THREE.Color(0x4a4f56);   // 中坡
const cHigh = new THREE.Color(0xa8b2bd);   // 高处（岩/雪）
for (let i = 0; i < pos.count; i++) {
  const x = pos.getX(i), z = pos.getZ(i);
  const px = (x/KMX + 0.5) * gw, py = (z/KMZ + 0.5) * gh;
  const e = elevAt(px, py);
  const y = isLake(px, py) ? (BASE - 3) : e;
  pos.setY(i, (y - BASE) / 1000 * VEX);
  const t = Math.max(0, Math.min(1, (e - EMIN) / (EMAX - EMIN)));
  const c = t < 0.5 ? cLow.clone().lerp(cMid, t*2) : cMid.clone().lerp(cHigh, (t-0.5)*2);
  colors.push(c.r, c.g, c.b);
}
geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
geo.computeVertexNormals();
const terrain = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
  vertexColors:true, roughness:0.94, metalness:0.04, flatShading:false
}));
scene.add(terrain);

// ---------- 湖面 ----------
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(KMX*3.2, KMZ*3.2),
  new THREE.MeshStandardMaterial({ color:0x05090d, roughness:0.62, metalness:0.18 })
);
water.rotation.x = -Math.PI/2;
water.position.y = (BASE - BASE) / 1000 * VEX - 0.012;
scene.add(water);

// ---------- 路线 ----------
const route = data.route.map(([nx, ny, e]) => new THREE.Vector3(
  (nx - 0.5) * KMX,
  (e - BASE) / 1000 * VEX + 0.085,
  (ny - 0.5) * KMZ
));
const curve = new THREE.CatmullRomCurve3(route, false, 'catmullrom', 0.15);

// 底光晕（粗淡线）
const halo = new THREE.Mesh(
  new THREE.TubeGeometry(curve, 1400, 0.028, 6, false),
  new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.11 })
);
scene.add(halo);
// 主线
const lineMat = new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.95 });
const line = new THREE.Mesh(new THREE.TubeGeometry(curve, 1400, 0.011, 6, false), lineMat);
scene.add(line);

// ---------- 进度光点 ----------
const dot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 18),
  new THREE.MeshBasicMaterial({ color:0xffffff }));
scene.add(dot);
const glow = new THREE.Mesh(new THREE.SphereGeometry(0.42, 18, 18),
  new THREE.MeshBasicMaterial({ color:0x9fd0ff, transparent:true, opacity:0.22 }));
scene.add(glow);

// ---------- 标签 ----------
const LABELS = [
  { t:'利斯特维扬卡（起点）', p: data.waypoints.find(w=>w.n.includes('Начало')) || data.waypoints[1], main:true },
  { t:'大戈洛（终点）',       p: data.waypoints.find(w=>w.n.includes('Окончание')) || data.waypoints[2], main:true },
  { t:'Листвянка', p:null },
];
const chosen = [];
const mainNames = ['Начало маршрута','Окончание маршрута'];
data.waypoints.forEach(w => { if (mainNames.some(m => w.n.includes(m.split(' ')[0]))) chosen.push({...w, main:true}); });
// 途中只挑「短名、有地名指向」的景点，避开 стоянка 长串
const mids = data.waypoints.filter(w =>
  !mainNames.some(m => w.n.includes(m.split(' ')[0])) &&
  !/стоянка/i.test(w.n) && w.n.length <= 30);
mids.slice(0, 4).forEach(w => chosen.push({...w, main:false}));

const labelEls = chosen.map((w, idx) => {
  const d = document.createElement('div');
  d.className = 'lbl' + (w.main ? ' main' : '');
  d.textContent = w.n.replace('Начало маршрута','利斯特维扬卡（起点）')
                    .replace('Окончание маршрута','大戈洛（终点）');
  document.body.appendChild(d);
  const p = new THREE.Vector3((w.x-0.5)*KMX, (w.e-BASE)/1000*VEX + 0.6, (w.y-0.5)*KMZ);
  return { el:d, p, off:(idx % 3) * 16 };
});

// ---------- 播放控制 ----------
let playing = true, u = 0;
const fill = document.getElementById('fill'), kmEl = document.getElementById('km'), btn = document.getElementById('play');
btn.onclick = () => { playing = !playing; btn.textContent = playing ? '暂停' : '播放'; };

let camMode = 'orbit';
controls.addEventListener('start', () => { camMode = 'free'; });

const clock = new THREE.Clock();
function tick(){
  const dt = Math.min(clock.getDelta(), 0.05);
  if (playing) {
    u += dt * 0.028;
    if (u > 1) { u = 0; }
  }
  const pt = curve.getPointAt(Math.min(u, 1));
  dot.position.copy(pt); glow.position.copy(pt);
  glow.scale.setScalar(1 + Math.sin(performance.now()/420)*0.16);

  fill.style.width = (u*100) + '%';
  kmEl.textContent = (u*data.lengthKm).toFixed(1) + ' / ' + data.lengthKm + ' km';

  // 相机跟随（未手动干预时）
  if (camMode !== 'free') {
    const ahead = curve.getPointAt(Math.min(u + 0.035, 1));
    const adj = camera.aspect < 1 ? 1.85 : 1.0;   // 窄屏（手机竖屏）自动拉远
    const want = ahead.clone().add(new THREE.Vector3(-7.5*adj, 5.2*adj, 7.5*adj));
    camera.position.lerp(want, 2.4*dt);
    controls.target.lerp(pt, 3.0*dt);
  }
  controls.update();
  renderer.render(scene, camera);

  labelEls.forEach(({el, p, off}) => {
    const v = p.clone().project(camera);
    const vis = v.z < 1 && v.x > -1.05 && v.x < 1.05 && v.y > -1.05 && v.y < 1.05;
    el.style.display = vis ? 'block' : 'none';
    // 贴边钳制，避免标签被屏幕切掉
    const halfW = el.offsetWidth / 2 + 6;
    const pxRaw = (v.x*0.5+0.5)*innerWidth;
    const pxClamped = Math.max(halfW, Math.min(innerWidth - halfW, pxRaw));
    el.style.left = pxClamped + 'px';
    el.style.top  = (-v.y*0.5+0.5)*innerHeight - (off||0) + 'px';
  });
  requestAnimationFrame(tick);
}
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.__b3 = { scene, camera, controls, renderer, THREE, curve, data,
                setU:(v)=>{u=v; camMode='free';}, follow:()=>{camMode='orbit';} };
</script>
